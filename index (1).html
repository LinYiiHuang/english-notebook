<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My English Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface2: #f0ede6;
    --border: #e0dbd0;
    --border2: #ccc8bc;
    --text: #1a1916;
    --text2: #6b6760;
    --text3: #a09d97;
    --accent: #2d5a3d;
    --accent-light: #e8f0eb;
    --amber: #b85c00;
    --amber-light: #fdf0e0;
    --red: #c0392b;
    --red-light: #fdecea;
    --radius: 10px;
    --radius-lg: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── Layout ── */
  .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 2rem 0;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .logo {
    padding: 0 1.5rem 1.75rem;
    border-bottom: 1px solid var(--border);
  }
  .logo-mark {
    font-family: 'Lora', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: -0.01em;
  }
  .logo-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .nav { padding: 1.25rem 0.75rem; flex: 1; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13.5px;
    color: var(--text2);
    transition: background 0.15s, color 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
  .nav-item .nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
  .nav-badge {
    margin-left: auto;
    font-size: 11px;
    font-weight: 500;
    background: var(--amber-light);
    color: var(--amber);
    padding: 1px 7px;
    border-radius: 20px;
    min-width: 22px;
    text-align: center;
  }
  .nav-badge.green { background: var(--accent-light); color: var(--accent); }

  .sidebar-footer {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text3);
    line-height: 1.8;
  }

  /* ── Main ── */
  .main { padding: 2.5rem 3rem; max-width: 820px; }

  .page { display: none; }
  .page.active { display: block; }

  .page-header { margin-bottom: 2rem; }
  .page-title {
    font-family: 'Lora', serif;
    font-size: 26px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .page-subtitle { font-size: 13px; color: var(--text3); margin-top: 4px; }

  /* ── Stats ── */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 2rem; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
  }
  .stat-num { font-family: 'DM Mono', monospace; font-size: 28px; font-weight: 500; color: var(--text); }
  .stat-num.amber { color: var(--amber); }
  .stat-num.green { color: var(--accent); }
  .stat-lbl { font-size: 11.5px; color: var(--text3); margin-top: 2px; letter-spacing: 0.03em; }

  /* ── Input Area ── */
  .input-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
  }
  .input-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.875rem;
  }
  .input-card-title { font-size: 13px; font-weight: 500; color: var(--text2); }
  .shortcut-hint {
    font-size: 11px;
    color: var(--text3);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    font-family: 'DM Mono', monospace;
  }

  /* ── Batch Textarea ── */
  #batch-area {
    width: 100%;
    min-height: 160px;
    max-height: 380px;
    resize: vertical;
    font-family: 'Lora', serif;
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.875rem 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #batch-area:focus { border-color: var(--accent); }
  #batch-area::placeholder { color: var(--text3); font-style: italic; font-family: 'Lora', serif; }

  .preview-list {
    margin-top: 0.875rem;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .preview-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 10px;
    background: var(--accent-light);
    border-radius: 6px;
    font-size: 13.5px;
    animation: fadeSlide 0.15s ease;
  }
  @keyframes fadeSlide { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
  .preview-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    min-width: 18px;
    flex-shrink: 0;
  }
  .preview-text { color: var(--accent); flex: 1; }

  .input-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.875rem;
    gap: 12px;
  }
  .input-meta { font-size: 12px; color: var(--text3); }
  .input-meta strong { color: var(--text2); font-weight: 500; }
  .input-actions { display: flex; gap: 8px; }

  button {
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }
  .btn {
    padding: 8px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: #234a30; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { background: var(--border2); color: var(--text3); cursor: not-allowed; }
  .btn-ghost {
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--border); }

  /* ── Type Selector ── */
  .type-row { display: flex; gap: 6px; margin-top: 0.875rem; }
  .type-btn {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .type-btn.selected { background: var(--accent); color: white; border-color: var(--accent); }
  .type-btn:hover:not(.selected) { background: var(--border); }

  /* ── Entry Cards ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }
  .section-label { font-size: 12px; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; }

  .entries { display: flex; flex-direction: column; gap: 8px; }

  .entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .entry:hover { border-color: var(--border2); }
  .entry.needs-zh { border-left: 3px solid var(--amber); }

  .entry-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .entry-en {
    font-family: 'Lora', serif;
    font-size: 15.5px;
    color: var(--text);
    flex: 1;
    line-height: 1.65;
  }
  .entry-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .entry-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); }

  .entry-tag {
    display: inline-block;
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 6px;
    margin-right: 4px;
  }
  .tag-phrase { background: #e8f4fd; color: #1a6496; }
  .tag-word { background: var(--accent-light); color: var(--accent); }
  .tag-idiom { background: var(--amber-light); color: var(--amber); }

  .entry-zh {
    font-size: 13.5px;
    color: var(--text2);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    line-height: 1.6;
  }

  .translate-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
  }
  .translate-row input {
    flex: 1;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13.5px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .translate-row input:focus { border-color: var(--accent); }

  .btn-save-zh {
    padding: 7px 14px;
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn-save-zh:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

  .btn-del {
    font-size: 13px;
    color: var(--text3);
    background: none;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .btn-del:hover { color: var(--red); background: var(--red-light); }

  /* ── Drag handle ── */
  .drag-handle {
    color: var(--text3);
    cursor: grab;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    line-height: 1;
    flex-shrink: 0;
    user-select: none;
  }
  .drag-handle:hover { color: var(--text2); background: var(--surface2); }
  .drag-handle:active { cursor: grabbing; }
  .entry.dragging { opacity: 0.4; }
  .entry.drag-over { border-color: var(--accent); background: var(--accent-light); }

  /* ── Editable zh ── */
  .entry-zh {
    font-size: 13.5px;
    color: var(--text2);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    line-height: 1.6;
    cursor: pointer;
    border-radius: 4px;
    padding: 6px 8px;
    margin-left: -8px;
    transition: background 0.15s;
  }
  .entry-zh:hover { background: var(--surface2); }
  .entry-zh-hint { font-size: 11px; color: var(--text3); margin-left: 6px; }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
  }
  .dot-pending { background: var(--amber); }
  .dot-done { background: #1D9E75; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 3rem 0;
    color: var(--text3);
    font-size: 14px;
    font-style: italic;
    font-family: 'Lora', serif;
  }
  .empty-icon { font-size: 32px; margin-bottom: 0.5rem; }

  /* ── Review banner ── */
  .review-banner {
    background: var(--amber-light);
    border: 1px solid #f0d0a0;
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    font-size: 13px;
    color: var(--amber);
  }

  /* ── Search ── */
  .search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  .search-bar input {
    flex: 1;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13.5px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--accent); }

  .filter-row { display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .filter-btn {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    background: var(--surface);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .filter-btn:hover:not(.active) { background: var(--surface2); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--text);
    color: var(--surface);
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 13.5px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.25s;
    pointer-events: none;
    z-index: 9999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">English Notebook</div>
      <div class="logo-sub">Daily Practice Log</div>
    </div>
    <nav class="nav">
      <button class="nav-item active" onclick="showPage('add')" id="nav-add">
        <span class="nav-icon">✏️</span> 今日新增
      </button>
      <button class="nav-item" onclick="showPage('review')" id="nav-review">
        <span class="nav-icon">📖</span> 待翻譯複習
        <span class="nav-badge" id="badge-pending">0</span>
      </button>
      <button class="nav-item" onclick="showPage('all')" id="nav-all">
        <span class="nav-icon">🗂</span> 全部筆記
        <span class="nav-badge green" id="badge-all">0</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      資料儲存於瀏覽器<br>
      僅限本機使用
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- 今日新增 -->
    <div class="page active" id="page-add">
      <div class="page-header">
        <div class="page-title">今日新增</div>
        <div class="page-subtitle" id="today-date-label"></div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-num" id="s-total">0</div>
          <div class="stat-lbl">總筆記數</div>
        </div>
        <div class="stat-card">
          <div class="stat-num amber" id="s-pending">0</div>
          <div class="stat-lbl">待翻譯</div>
        </div>
        <div class="stat-card">
          <div class="stat-num green" id="s-done">0</div>
          <div class="stat-lbl">已完成</div>
        </div>
      </div>

      <div class="input-card">
        <div class="input-card-header">
          <span class="input-card-title">連續輸入模式</span>
          <span class="shortcut-hint">Enter × 2 換下一句</span>
        </div>
        <textarea
          id="batch-area"
          placeholder="開始打英文句子或單字...

打完一個句子後，按兩下 Enter 換下一句。
可連續輸入多句，最後再點「全部新增」。"
        ></textarea>
        <div class="preview-list" id="preview-list"></div>
        <div class="type-row">
          <button class="type-btn selected" onclick="selectType(this,'phrase')">句子</button>
          <button class="type-btn" onclick="selectType(this,'word')">單字</button>
          <button class="type-btn" onclick="selectType(this,'idiom')">慣用語</button>
        </div>
        <div class="input-footer">
          <div class="input-meta">已準備 <strong id="preview-count">0</strong> 筆</div>
          <div class="input-actions">
            <button class="btn btn-ghost" onclick="clearBatch()">清除</button>
            <button class="btn btn-primary" id="btn-add-all" onclick="addAllEntries()" disabled>全部新增</button>
          </div>
        </div>
      </div>

      <div class="section-header">
        <span class="section-label">今日已記錄</span>
      </div>
      <div class="entries" id="list-today"></div>
    </div>

    <!-- 待翻譯複習 -->
    <div class="page" id="page-review">
      <div class="page-header">
        <div class="page-title">待翻譯複習</div>
        <div class="page-subtitle">為還沒補上的句子加入中文意思</div>
      </div>
      <div class="review-banner" id="review-banner" style="display:none">
        <span id="review-banner-text">共 0 筆待補充翻譯</span>
      </div>
      <div class="entries" id="list-review"></div>
    </div>

    <!-- 全部筆記 -->
    <div class="page" id="page-all">
      <div class="page-header">
        <div class="page-title">全部筆記</div>
        <div class="page-subtitle">搜尋與瀏覽所有記錄</div>
      </div>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="搜尋英文或中文..." oninput="renderAll()">
      </div>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
        <button class="filter-btn" onclick="setFilter('phrase',this)">句子</button>
        <button class="filter-btn" onclick="setFilter('word',this)">單字</button>
        <button class="filter-btn" onclick="setFilter('idiom',this)">慣用語</button>
        <button class="filter-btn" onclick="setFilter('pending',this)">待翻譯</button>
        <button class="filter-btn" onclick="setFilter('done',this)">已完成</button>
      </div>
      <div class="entries" id="list-all"></div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────
let entries = JSON.parse(localStorage.getItem('en-nb-v2') || '[]');
let selectedType = 'phrase';
let allFilter = 'all';

// ── Persist ────────────────────────────────────────────
function save() {
  localStorage.setItem('en-nb-v2', JSON.stringify(entries));
  updateBadges();
  renderAll();
}

// ── Date helpers ───────────────────────────────────────
function todayStr() {
  return new Date().toLocaleDateString('zh-TW', { month:'2-digit', day:'2-digit' });
}
function fullDate() {
  return new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
}

// ── Batch input logic ──────────────────────────────────
let pendingLines = [];

const batchArea = document.getElementById('batch-area');
const previewList = document.getElementById('preview-list');
const previewCount = document.getElementById('preview-count');
const btnAddAll = document.getElementById('btn-add-all');

batchArea.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  const val = this.value;
  const endsDoubleEnter = val.endsWith('\n') || val.endsWith('\n\n');
  // detect second Enter: last char is already a newline
  const lines = val.split('\n');
  const lastLine = lines[lines.length - 1];
  const secondToLast = lines[lines.length - 2] ?? '';

  if (e.key === 'Enter' && secondToLast.trim() === '' && lastLine.trim() === '') {
    // two consecutive empty lines = commit the sentence above
    e.preventDefault();
    const sentence = lines.slice(0, lines.length - 2).join('\n').split('\n').filter(l => l.trim()).pop();
    if (!sentence) return;
    // find the last non-empty content before the double-enter
    const allContent = val.replace(/\n\n$/, '').trim();
    const lastSentenceMatch = allContent.split(/\n\n+/).filter(Boolean);
    const lastEntry = lastSentenceMatch[lastSentenceMatch.length - 1]?.trim();
    if (lastEntry && !pendingLines.includes(lastEntry)) {
      pendingLines.push(lastEntry);
      updatePreview();
    }
    this.value = '';
    return;
  }
});

// Also handle on input change for the preview of current typed content
batchArea.addEventListener('input', function() {
  // If double-newline triggers commit, we handle it above
  // Here just show a live count hint (optional)
});

// Alternative simpler approach: parse on Enter key
batchArea.addEventListener('keyup', function(e) {
  if (e.key === 'Enter') {
    const val = this.value;
    // Check if we have \n\n pattern = commit previous line
    const segments = val.split(/\n{2,}/);
    // segments that are complete (not the last one which user is still typing)
    const completed = segments.slice(0, -1).map(s => s.trim()).filter(Boolean);
    completed.forEach(seg => {
      if (!pendingLines.includes(seg)) {
        pendingLines.push(seg);
      }
    });
    // Clear the committed parts from textarea, keep only last segment
    if (completed.length > 0) {
      const remaining = segments[segments.length - 1];
      this.value = remaining;
      updatePreview();
    }
  }
});

function updatePreview() {
  previewList.innerHTML = pendingLines.map((line, i) =>
    `<div class="preview-item">
      <span class="preview-num">${String(i+1).padStart(2,'0')}</span>
      <span class="preview-text">${escHtml(line)}</span>
    </div>`
  ).join('');
  previewCount.textContent = pendingLines.length;
  btnAddAll.disabled = pendingLines.length === 0;
}

function addAllEntries() {
  // Also grab anything remaining in the textarea
  const remaining = batchArea.value.trim();
  if (remaining) pendingLines.push(remaining);
  if (pendingLines.length === 0) return;

  const date = todayStr();
  const ts = Date.now();
  pendingLines.forEach((line, i) => {
    entries.unshift({
      id: ts + i,
      en: line,
      zh: '',
      type: selectedType,
      date,
      ts: ts + i
    });
  });
  pendingLines = [];
  batchArea.value = '';
  updatePreview();
  save();
  showToast(`已新增 ${pendingLines.length || entries.filter(e=>e.date===todayStr()).length} 筆筆記 ✓`);
  renderToday();
}

function clearBatch() {
  pendingLines = [];
  batchArea.value = '';
  updatePreview();
}

function selectType(btn, type) {
  selectedType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

// ── Render helpers ─────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const typeLabels = { phrase:'句子', word:'單字', idiom:'慣用語' };

function entryCardHTML(e, showInput) {
  const hasCh = e.zh && e.zh.length > 0;
  const dot = hasCh ? 'dot-done' : 'dot-pending';
  const needsClass = hasCh ? '' : 'needs-zh';
  return `<div class="entry ${needsClass}" id="entry-${e.id}" draggable="true" data-id="${e.id}">
    <div class="entry-head">
      <span class="drag-handle" title="拖曳排序">⠿</span>
      <div class="entry-en">${escHtml(e.en)}</div>
      <div class="entry-actions">
        <span class="entry-date">${e.date}</span>
        <span class="status-dot ${dot}"></span>
        <button class="btn-del" onclick="deleteEntry(${e.id})" title="刪除">×</button>
      </div>
    </div>
    <span class="entry-tag tag-${e.type}">${typeLabels[e.type]||e.type}</span>
    ${hasCh ? `<div class="entry-zh" onclick="editZh(${e.id}, this)" title="點擊編輯">${escHtml(e.zh)}<span class="entry-zh-hint">點擊編輯</span></div>` : ''}
    ${(!hasCh) ? `
    <div class="translate-row" id="tr-${e.id}">
      <input type="text" placeholder="輸入中文意思..." value="${escHtml(e.zh||'')}" id="zh-${e.id}"
        onkeydown="if(event.key==='Enter'){saveZh(${e.id},this.value)}" />
      <button class="btn-save-zh" onclick="saveZh(${e.id},document.getElementById('zh-${e.id}').value)">儲存</button>
    </div>` : ''}
  </div>`;
}

function editZh(id, el) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  const parent = el.parentElement;
  el.remove();
  const row = document.createElement('div');
  row.className = 'translate-row';
  row.id = 'tr-' + id;
  row.innerHTML = `<input type="text" placeholder="輸入中文意思..." value="${escHtml(e.zh||'')}" id="zh-${id}"
    onkeydown="if(event.key==='Enter'){saveZh(${id},this.value)}" />
    <button class="btn-save-zh" onclick="saveZh(${id},document.getElementById('zh-${id}').value)">儲存</button>`;
  parent.appendChild(row);
  const input = document.getElementById('zh-' + id);
  input.focus();
  input.select();
}

// ── Drag & Drop ────────────────────────────────────────
let dragSrcId = null;

function initDrag(container) {
  container.querySelectorAll('.entry[draggable]').forEach(card => {
    card.addEventListener('dragstart', e => {
      dragSrcId = parseInt(card.dataset.id);
      setTimeout(() => card.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      container.querySelectorAll('.entry').forEach(c => c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      container.querySelectorAll('.entry').forEach(c => c.classList.remove('drag-over'));
      if (parseInt(card.dataset.id) !== dragSrcId) card.classList.add('drag-over');
    });
    card.addEventListener('drop', e => {
      e.preventDefault();
      const targetId = parseInt(card.dataset.id);
      if (dragSrcId === null || dragSrcId === targetId) return;
      const srcIdx = entries.findIndex(x => x.id === dragSrcId);
      const tgtIdx = entries.findIndex(x => x.id === targetId);
      if (srcIdx === -1 || tgtIdx === -1) return;
      const [moved] = entries.splice(srcIdx, 1);
      entries.splice(tgtIdx, 0, moved);
      dragSrcId = null;
      save();
    });
  });
}

function renderToday() {
  const today = todayStr();
  const list = entries.filter(e => e.date === today);
  const el = document.getElementById('list-today');
  el.innerHTML = list.length
    ? list.map(e => entryCardHTML(e, false)).join('')
    : `<div class="empty"><div class="empty-icon">📝</div>今天還沒有筆記，開始輸入吧！</div>`;
  initDrag(el);
}

function renderReview() {
  const pending = entries.filter(e => !e.zh);
  const banner = document.getElementById('review-banner');
  const el = document.getElementById('list-review');
  if (pending.length > 0) {
    banner.style.display = 'flex';
    document.getElementById('review-banner-text').textContent = `共 ${pending.length} 筆待補充翻譯`;
  } else {
    banner.style.display = 'none';
  }
  el.innerHTML = pending.length
    ? pending.map(e => entryCardHTML(e, true)).join('')
    : `<div class="empty"><div class="empty-icon">🎉</div>所有筆記都已翻譯完成！</div>`;
  initDrag(el);
}

function renderAll() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  let list = entries;
  if (allFilter === 'pending') list = list.filter(e => !e.zh);
  else if (allFilter === 'done') list = list.filter(e => e.zh);
  else if (allFilter !== 'all') list = list.filter(e => e.type === allFilter);
  if (q) list = list.filter(e => e.en.toLowerCase().includes(q) || (e.zh||'').includes(q));
  const el = document.getElementById('list-all');
  el.innerHTML = list.length
    ? list.map(e => entryCardHTML(e, false)).join('')
    : `<div class="empty"><div class="empty-icon">🔍</div>找不到符合的筆記</div>`;
  initDrag(el);
}

// ── Actions ────────────────────────────────────────────
function saveZh(id, val) {
  const e = entries.find(e => e.id === id);
  if (e) { e.zh = val.trim(); save(); showToast('翻譯已儲存 ✓'); }
}

function deleteEntry(id) {
  if (!confirm('確定刪除這筆記錄？')) return;
  entries = entries.filter(e => e.id !== id);
  save();
}

function setFilter(f, btn) {
  allFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

// ── Badges ─────────────────────────────────────────────
function updateBadges() {
  const pending = entries.filter(e => !e.zh).length;
  document.getElementById('badge-pending').textContent = pending;
  document.getElementById('badge-all').textContent = entries.length;
  document.getElementById('s-total').textContent = entries.length;
  document.getElementById('s-pending').textContent = pending;
  document.getElementById('s-done').textContent = entries.filter(e => e.zh).length;
}

// ── Nav ────────────────────────────────────────────────
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('nav-' + page).classList.add('active');
  if (page === 'review') renderReview();
  if (page === 'all') renderAll();
}

// ── Toast ──────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Init ───────────────────────────────────────────────
document.getElementById('today-date-label').textContent = fullDate();
updateBadges();
renderToday();
</script>
</body>
</html>
